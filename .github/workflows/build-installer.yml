name: Build Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows GUI installer (self-contained, GnuPG bundled)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (GUI)
        shell: pwsh
        run: |
          pip install --upgrade pip
          pip install -e .[windows,gui]
          pip install pyinstaller

      - name: Build standalone GUI executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onedir --windowed --noconfirm --name pancalc-tools-gui `
            --collect-all flet --collect-all pcalc --collect-all fitz --collect-all gnupg `
            --hidden-import pcalc.gui --hidden-import pcalc.gui_views `
            --hidden-import pcalc.cli --hidden-import pcalc.tui --hidden-import pcalc.installer `
            --hidden-import pcalc.converter --hidden-import pcalc.registry --hidden-import pcalc.crypto `
            --hidden-import pcalc.config --hidden-import pcalc.banner --hidden-import pcalc.theme `
            --hidden-import pcalc.calculator --hidden-import pcalc.library `
            --icon installer/favicon.ico `
            main_gui.py

      - name: Download and bundle standalone GnuPG
        shell: pwsh
        run: |
          $gnupgFile = "gnupg-w32-2.5.21_20260702.exe"
          Invoke-WebRequest -Uri https://www.gnupg.org/ftp/gcrypt/binary/$gnupgFile -OutFile installer/prereqs/$gnupgFile
          if (!(Test-Path installer\prereqs\$gnupgFile)) {
            Write-Error "GnuPG installer not found"
            exit 1
          }
          # Install to a temp prefix, then copy the GnuPG binaries into the bundle
          Start-Process -FilePath installer\prereqs\$gnupgFile -ArgumentList "/S","/D=$env:TEMP\gpgprefix" -Wait
          $gpgSrc = Join-Path $env:TEMP "gpgprefix\GnuPG\bin"
          if (!(Test-Path $gpgSrc)) {
            $gpgSrc = "C:\Program Files (x86)\GnuPG\bin"
          }
          $gpgDst = "dist\pancalc-tools-gui\gpg\bin"
          New-Item -ItemType Directory -Force -Path $gpgDst | Out-Null
          Copy-Item -Path "$gpgSrc\*" -Destination $gpgDst -Recurse -Force
          Write-Output "Bundled GnuPG contents:"
          Get-ChildItem -Path $gpgDst | Select-Object -First 20

      - name: Extract version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --limit-output

      - name: Compile Inno Setup installer
        shell: cmd
        run: iscc installer\pancalc-tools.iss /DMyAppVersion=%APP_VERSION%

      - name: Upload installer to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: PanCalc-Tools-Setup-*.exe

      - name: Upload installer as workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: PanCalc-Tools-Installer
          path: PanCalc-Tools-Setup-*.exe
