[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pancalc-tools"
dynamic = ["version"]
description = "Package manager and developer toolkit for Casio Prizm calculators"
readme = "README.md"
license = { text = "AGPL-3.0-only (GNU Affero General Public License v3.0)" }
authors = [{ name = "Pan Devs", email = "pan.devs@proton.me" }]
requires-python = ">=3.10"
keywords = ["casio", "prizm", "fx-cg50", "calculator", "package-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "questionary>=2.0",
    "requests>=2.31",
    "Pillow>=10.0",
    "pymupdf>=1.23",
    "platformdirs>=4.0",
    "textual>=8.2.7",
    "python-gnupg>=0.5.0",
]

[project.scripts]
pcalc = "pcalc.cli:cli"
pcalc-gui = "main_gui:main"

[tool.setuptools.packages.find]
include = ["pcalc*"]

[tool.setuptools.dynamic]
version = { attr = "pcalc.__version__" }

[project.optional-dependencies]
windows = ["pywin32"]
gui = ["flet>=0.21.0"]
ocr = ["onnxruntime>=1.18,<2", "rapidocr-onnxruntime>=1.3.24"]
dev = ["pytest>=7.0", "ruff>=0.1.0"]